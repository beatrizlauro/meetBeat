spring.application.name=matching

# Porta HTTP. Na nuvem (Render) a variável PORT é definida pela plataforma; localmente fica 8080.
server.port=${PORT:8080}
spring.neo4j.uri=neo4j://127.0.0.1:7687
spring.neo4j.authentication.username=neo4j
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Web Client ID criado no Google Cloud Console (OAuth consent screen), usado para
# validar a "audience" dos tokens do Google Sign-In. É um identificador público, não um segredo.
google.oauth.web-client-id=524293189393-1sqq63ainkf55jpvktt8jkkap3vdpmra.apps.googleusercontent.com

# Tempo de validade do token JWT, em milissegundos (12 horas, folga para o dia da apresentação)
jwt.expiration-ms=43200000

# E-mail (SMTP) usado para enviar o código de recuperação de senha ("Esqueci minha senha").
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Na nuvem gratuita (Render) as portas SMTP são bloqueadas. Se brevo.api-key estiver preenchida
# (variável BREVO_API_KEY), o e-mail é enviado pela API HTTPS da Brevo em vez do SMTP.
brevo.api-key=${BREVO_API_KEY:}

# Segredos (senha do Neo4j, chave do JWT, credenciais de e-mail) ficam em
# application-secrets.properties, fora do Git. Modelo: application-secrets.properties.example
spring.config.import=optional:classpath:application-secrets.properties
